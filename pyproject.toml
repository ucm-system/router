[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ucm-router"
version = "0.1.0"
description = "Minimal PD-disaggregation router for UCM (Unified Cache Manager) deployments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["ucm_router*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
